[project]
name = "feishu-doc-mcp"
version = "0.1.0"
description = "FastMCP thin wrapper over lark-cli for Feishu docx comment-driven cowork editing"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_doc_mcp"]

[project.scripts]
feishu-doc-mcp = "feishu_doc_mcp.server:main"
